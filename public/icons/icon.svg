<svg width="512" height="512" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#071113;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0d1b1d;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#2ff0b8;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#08b889;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="512" height="512" fill="url(#bg)" rx="64"/>

  <!-- Chart background -->
  <rect x="64" y="128" width="384" height="256" fill="rgba(255,255,255,0.05)" rx="8"/>

  <!-- Grid lines -->
  <g stroke="rgba(255,255,255,0.1)" stroke-width="1">
    <line x1="64" y1="192" x2="448" y2="192"/>
    <line x1="64" y1="256" x2="448" y2="256"/>
    <line x1="64" y1="320" x2="448" y2="320"/>
    <line x1="128" y1="128" x2="128" y2="384"/>
    <line x1="256" y1="128" x2="256" y2="384"/>
    <line x1="384" y1="128" x2="384" y2="384"/>
  </g>

  <!-- Chart line -->
  <path d="M 80 320 L 120 280 L 160 300 L 200 240 L 240 260 L 280 200 L 320 220 L 360 180 L 400 200 L 440 160"
        fill="none"
        stroke="url(#accent)"
        stroke-width="4"
        stroke-linecap="round"
        stroke-linejoin="round"/>

  <!-- Data points -->
  <circle cx="120" cy="280" r="3" fill="#2ff0b8"/>
  <circle cx="200" cy="240" r="3" fill="#2ff0b8"/>
  <circle cx="280" cy="200" r="3" fill="#2ff0b8"/>
  <circle cx="360" cy="180" r="3" fill="#2ff0b8"/>
  <circle cx="440" cy="160" r="3" fill="#2ff0b8"/>

  <!-- FX Symbol -->
  <text x="256" y="80" text-anchor="middle" fill="#2ff0b8" font-family="Arial, sans-serif" font-size="48" font-weight="bold">FX</text>

  <!-- Currency symbols -->
  <text x="80" y="450" fill="rgba(255,255,255,0.6)" font-family="Arial, sans-serif" font-size="24">$</text>
  <text x="120" y="450" fill="rgba(255,255,255,0.6)" font-family="Arial, sans-serif" font-size="24">€</text>
  <text x="160" y="450" fill="rgba(255,255,255,0.6)" font-family="Arial, sans-serif" font-size="24">£</text>
  <text x="200" y="450" fill="rgba(255,255,255,0.6)" font-family="Arial, sans-serif" font-size="24">¥</text>
</svg>